<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="earthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Earth sphere -->
  <circle cx="16" cy="16" r="14" fill="url(#earthGradient)" stroke="#1e3a8a" stroke-width="0.5"/>
  
  <!-- Continents (simplified) -->
  <path d="M 8 12 Q 12 10, 16 12 Q 20 14, 22 16 Q 20 18, 16 20 Q 12 18, 8 16 Z" fill="#228B22" opacity="0.8"/>
  <path d="M 6 20 Q 10 18, 14 20 Q 18 22, 22 24 Q 18 26, 14 24 Q 10 22, 6 20 Z" fill="#8B4513" opacity="0.6"/>
  <ellipse cx="20" cy="10" rx="3" ry="2" fill="#228B22" opacity="0.7"/>
  
  <!-- Highlight for 3D effect -->
  <circle cx="16" cy="16" r="14" fill="url(#highlight)"/>
  
  <!-- Subtle grid lines for globe effect -->
  <path d="M 2 16 Q 16 12, 30 16" stroke="#ffffff" stroke-width="0.3" opacity="0.3" fill="none"/>
  <path d="M 2 16 Q 16 20, 30 16" stroke="#ffffff" stroke-width="0.3" opacity="0.3" fill="none"/>
  <ellipse cx="16" cy="16" rx="14" ry="7" stroke="#ffffff" stroke-width="0.3" opacity="0.2" fill="none"/>
</svg>
